spring.application.name=contrato
spring.datasource.url=jdbc:mysql://mysql:3306/contrato
#spring.datasource.url=jdbc:mysql://localhost:3307/contrato

spring.datasource.username=root
spring.datasource.password=Stevenpozo12.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
